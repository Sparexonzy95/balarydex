<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Coin Background: Obsidian with Dark Amber Ambient Glow -->
    <radialGradient id="bal-bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#22190A" />
      <stop offset="70%" stop-color="#111218" />
      <stop offset="100%" stop-color="#08090E" />
    </radialGradient>

    <!-- Golden Rim Gradient -->
    <linearGradient id="bal-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="30%" stop-color="#F59E0B" />
      <stop offset="70%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>

    <!-- Primary Balary Gold Emblem Gradient -->
    <linearGradient id="bal-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="25%" stop-color="#FBBF24" />
      <stop offset="75%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <!-- Secondary Accent Gradient -->
    <linearGradient id="bal-amber" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#FBBF24" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="bal-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#F59E0B" flood-opacity="0.35" />
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Outer Bezel Ring -->
  <circle cx="64" cy="64" r="61" fill="none" stroke="url(#bal-rim)" stroke-width="2" opacity="0.85" />

  <!-- Coin Body -->
  <circle cx="64" cy="64" r="57" fill="url(#bal-bg)" stroke="url(#bal-rim)" stroke-width="1.5" />

  <!-- Inner Subtle Hexagon / Circular Watermark Ring -->
  <circle cx="64" cy="64" r="51" fill="none" stroke="#F59E0B" stroke-width="0.75" stroke-dasharray="4 4" opacity="0.35" />

  <!-- Balary Monogram "B" Emblem -->
  <g filter="url(#bal-shadow)" transform="translate(6, 4)">
    <!-- Backbone Vertical Pillar -->
    <path 
      d="M32 26 C32 23.8 33.8 22 36 22 L46 22 C48.2 22 50 23.8 50 26 L50 94 C50 96.2 48.2 98 46 98 L36 98 C33.8 98 32 96.2 32 94 Z" 
      fill="url(#bal-gold)" 
    />

    <!-- Top Lobe of "B" -->
    <path 
      d="M48 22 L68 22 C79 22 87 28.5 87 39.5 C87 49 80 56 69 57.5 L48 57.5 Z" 
      fill="url(#bal-gold)" 
    />
    <!-- Top Lobe Cutout -->
    <path 
      d="M50 33 L67 33 C72.5 33 76.5 35.5 76.5 39.5 C76.5 43.5 72.5 46.5 67 46.5 L50 46.5 Z" 
      fill="#14151C" 
    />

    <!-- Bottom Lobe of "B" -->
    <path 
      d="M48 56.5 L72 56.5 C84 56.5 93 64 93 76.5 C93 89 83 98 70 98 L48 98 Z" 
      fill="url(#bal-amber)" 
    />
    <!-- Bottom Lobe Cutout -->
    <path 
      d="M50 67.5 L70 67.5 C76 67.5 81.5 70.8 81.5 76.5 C81.5 82.2 76 87 70 87 L50 87 Z" 
      fill="#14151C" 
    />

    <!-- Dynamic DEX Swap Arc Accent cutting through the middle -->
    <path 
      d="M26 60 L44 60 L38 54 Z" 
      fill="#FDE68A" 
    />
    <path 
      d="M52 60 L34 60 L40 66 Z" 
      fill="#F59E0B" 
    />

    <!-- Specular Highlight Sheen on Top -->
    <circle cx="76.5" cy="39.5" r="2.5" fill="#FFFFFF" opacity="0.9" />
  </g>
</svg>
